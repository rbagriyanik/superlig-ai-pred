<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Global Futbol Karşılaşmaları Haftalık Tahminleri</title>

  <!-- PWA ve Mobil Uygulama Desteği -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GlobalFutbol">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/53/53283.png">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 15px; }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 6px; }
    .header p { color: #94a3b8; font-size: 0.95rem; }
    .controls-bar { width: 100%; max-width: 950px; display: flex; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .search-input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background-color: #1e293b; color: #f8fafc; outline: none; }
    .search-input:focus { border-color: #38bdf8; }
    .table-container { width: 100%; max-width: 950px; background-color: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); overflow: hidden; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    thead { background-color: #0f172a; border-bottom: 2px solid #334155; }
    th { padding: 14px 16px; font-size: 0.85rem; text-transform: uppercase; color: #38bdf8; }
    td { padding: 14px 16px; border-bottom: 1px solid #334155; font-size: 0.9rem; color: #e2e8f0; }
    tbody tr { cursor: pointer; transition: background-color 0.2s ease; }
    tbody tr:hover { background-color: #334155; }
    .derby-row { background-color: rgba(239, 68, 68, 0.12) !important; }
    .derby-badge { background-color: #ef4444; color: #ffffff; padding: 2px 7px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; margin-left: 6px; }
    .league-badge { background-color: #334155; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-right: 6px; }
    .action-btn { background-color: #0284c7; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; backdrop-filter: blur(4px); }
    .modal-card { background-color: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; width: 100%; max-width: 650px; padding: 24px; box-shadow: 0 20px 30px rgba(0,0,0,0.6); position: relative; max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
    .close-btn:hover { color: #fff; }
    .match-header-card { display: flex; justify-content: space-around; align-items: center; margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 12px; }
    .team-box { text-align: center; flex: 1; }
    .team-name { font-size: 1.1rem; font-weight: bold; color: #f8fafc; }
    .score-pred { font-size: 1.8rem; font-weight: 800; color: #38bdf8; padding: 0 10px; }
    .prob-bar-container { margin: 15px 0; }
    .prob-title { font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    .prob-bar { display: flex; height: 20px; border-radius: 10px; overflow: hidden; background-color: #334155; }
    .prob-home { background-color: #10b981; }
    .prob-draw { background-color: #f59e0b; }
    .prob-away { background-color: #3b82f6; }
    .prob-legend { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 6px; }
    .analysis-text { background-color: #0f172a; padding: 14px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; color: #cbd5e1; margin-top: 15px; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .stat-card { background: #0f172a; padding: 10px; border-radius: 8px; text-align: center; }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
    .stat-lbl { font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="controls-bar">

  </div>

  <div class="table-container">

          <th>AI Analiz</th>

      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="modal-overlay" id="matchModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

      { id: 12, league: "Serie A", date: "18.10.2026 Pazar", time: "21:45", home: "Juventus", away: "SS Lazio", stadium: "Juventus Stadyumu", isDerby: true, predScore: "1 - 0", probHome: 50, probDraw: 32, probAway: 18, comment: "Juve evinde sağlam savunma disipliniyle Lazio akınlarını kesip tek golle kazanabilir.", homeXg: "1.30", awayXg: "0.65", bestPick: "MS 1 & 2.5 Alt" },

      // İSPANYA - LA LIGA
      { id: 13, league: "La Liga", date: "17.10.2026 Cumartesi", time: "19:30", home: "Real Betis", away: "Barcelona", stadium: "Sevilla Olimpiyat Stadyumu", predScore: "1 - 3", probHome: 18, probDraw: 22, probAway: 60, comment: "Barca yüksek ön alan baskısı ve xG üretkenliği ile gollü bir galibiyet alabilir.", homeXg: "0.90", awayXg: "2.50", bestPick: "MS 2 & 2.5 Üst" },

      { id: 15, league: "La Liga", date: "25.10.2026 Pazar", time: "23:00", home: "Barcelona", away: "Real Madrid", stadium: "Camp Nou", isDerby: true, predScore: "2 - 2", probHome: 38, probDraw: 32, probAway: 30, comment: "Dünyanın gözünün çevrileceği El Clasico mücadelesinde taraf bahsi yerine gollere yönelmek mantıklı.", homeXg: "1.95", awayXg: "1.85", bestPick: "KG Var & 2.5 Üst" },

      { id: 18, league: "Bundesliga", date: "31.10.2026 Cumartesi", time: "20:30", home: "Bayern Münih", away: "Borussia Dortmund", stadium: "Allianz Arena", isDerby: true, predScore: "3 - 2", probHome: 58, probDraw: 22, probAway: 20, comment: "Der Klassikede yüksek xG beklentisi mevcut. İki takımın da skor üretmesi kaçınılmaz.", homeXg: "2.90", awayXg: "1.80", bestPick: "3.5 Üst" },

      // İNGİLTERE - PREMIER LEAGUE

      { id: 23, league: "Liga Portugal", date: "25.10.2026 Pazar", time: "23:30", home: "Sporting CP", away: "Académico Viseu", stadium: "Estádio José Alvalade", predScore: "3 - 0", probHome: 78, probDraw: 15, probAway: 7, comment: "Sporting Alvaladede maça çok hızlı başlayarak ilk yarıdan skoru yakalayacaktır.", homeXg: "2.80", awayXg: "0.30", bestPick: "İY 1 & MS 1" },
      { id: 24, league: "Liga Portugal", date: "26.10.2026 Pazartesi", time: "21:45", home: "CD Santa Clara", away: "Benfica", stadium: "Estadio de São Miguel", predScore: "1 - 2", probHome: 22, probDraw: 28, probAway: 50, comment: "Ada deplasmanı Benfica için fiziksel açıdan yıpratıcı geçse de bitiricilik farkı galibiyeti getirir.", homeXg: "0.85", awayXg: "1.75", bestPick: "Maç Sonucu 2" }
    ];

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      data.forEach(m => {
        const tr = document.createElement('tr');
        if(m.isDerby) tr.classList.add('derby-row');
        tr.onclick = () => openModal(m.id);
        tr.innerHTML = `
          <td>${m.date}</td>
          <td>${m.time}</td>
          <td><span class="league-badge">${m.league}</span></td>
          <td><strong>${m.home}</strong></td>
          <td><strong>${m.away}</strong></td>
          <td>${m.stadium} ${m.isDerby ? '<span class="derby-badge">KRİTİK / DERBİ</span>' : ''}</td>
          <td><span class="action-btn">Analiz İncele</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openModal(id) {
      const match = matches.find(m => m.id === id);
      if(!match) return;
      document.getElementById('modalContent').innerHTML = `
        <div style="text-align:center; margin-bottom:10px;"><span class="league-badge" style="font-size:0.85rem;">${match.league}</span></div>
        <div class="match-header-card">
          <div class="team-box"><div class="team-name">${match.home}</div><div style="font-size:0.75rem; color:#94a3b8;">Ev Sahibi</div></div>
          <div class="score-pred">${match.predScore}</div>
          <div class="team-box"><div class="team-name">${match.away}</div><div style="font-size:0.75rem; color:#94a3b8;">Deplasman</div></div>
        </div>
        <div class="prob-bar-container">
          <div class="prob-title">AI Olasılık Tahmini (%)</div>
          <div class="prob-bar">
            <div class="prob-home" style="width: ${match.probHome}%"></div>
            <div class="prob-draw" style="width: ${match.probDraw}%"></div>
            <div class="prob-away" style="width: ${match.probAway}%"></div>
          </div>
          <div class="prob-legend">
            <span style="color:#10b981;">1 (${match.probHome}%)</span>
            <span style="color:#f59e0b;">X (${match.probDraw}%)</span>
            <span style="color:#3b82f6;">2 (${match.probAway}%)</span>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-val">${match.homeXg} - ${match.awayXg}</div><div class="stat-lbl">Beklenen Gol (xG)</div></div>
          <div class="stat-card"><div class="stat-val">${match.bestPick}</div><div class="stat-lbl">Önerilen AI Bahis Tercihi</div></div>
        </div>
        <div class="analysis-text"><strong style="color:#38bdf8;">🧠 Yapay Zeka Taktiksel Yorumu:</strong><br/>${match.comment}</div>
      `;
      document.getElementById('matchModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('matchModal').style.display = 'none'; }
    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderTable(matches.filter(m => 
        m.home.toLowerCase().includes(q) || 
        m.away.toLowerCase().includes(q) || 
        m.league.toLowerCase().includes(q)
      ));
    }
    window.onclick = function(e) { if (e.target === document.getElementById('matchModal')) closeModal(); }
    renderTable(matches);
  </script>
</body>
</html>
