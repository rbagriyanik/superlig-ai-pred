    function renderTable(data) {
      var tbody = document.getElementById('tableBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      for (var i = 0; i < data.length; i++) {
        var m = data[i];
        var tr = document.createElement('tr');
        if (m.isDerby) {
          tr.className = 'derby-row';
        }

        (function(matchId) {
          tr.onclick = function() {
            openModal(matchId);
          };
        })(m.id);

        var derbyTag = m.isDerby ? '<span class="derby-badge">DERBİ</span>' : '';

        tr.innerHTML = 
          '<td>' + m.date + '</td>' +
          '<td>' + m.time + '</td>' +
          '<td><span class="league-badge">' + m.league + '</span></td>' +
          '<td><strong>' + m.home + '</strong></td>' +
          '<td><strong>' + m.away + '</strong></td>' +
          '<td>' + m.stadium + derbyTag + '</td>' +
          '<td><span class="action-btn">Analiz İncele</span></td>';

        tbody.appendChild(tr);
      }
    }

    function renderStandings() {
      var tbody = document.getElementById('standingsBody');
      if (!tbody) return;
      tbody.innerHTML = '';

      for (var i = 0; i < standings.length; i++) {
        var s = standings[i];
        var tr = document.createElement('tr');

        if (s.pos <= 3) {
          tr.className = 'top-three';
        } else if (s.pos >= 15) {
          tr.className = 'relegation-zone';
        }

        (function(teamObj) {
          tr.onclick = function() {
            openTeamModal(teamObj);
          };
        })(s);

        tr.innerHTML = 
          '<td>' + s.pos + '</td>' +
          '<td class="team-cell">' + s.team + '</td>' +
          '<td>' + s.o + '</td>' +
          '<td>' + s.g + '</td>' +
          '<td>' + s.b + '</td>' +
          '<td>' + s.m + '</td>' +
          '<td>' + s.ag + '</td>' +
          '<td>' + s.yg + '</td>' +
          '<td>' + s.av + '</td>' +
          '<td><strong>' + s.p + '</strong></td>';

        tbody.appendChild(tr);
      }
    }

    function openTeamModal(team) {
      var modalContent = document.getElementById('modalContent');
      if (!modalContent) return;
      
      var formArr = team.form.split('-');
      var formHtml = '';
      for (var i = 0; i < formArr.length; i++) {
        var bClass = formArr[i] === 'G' ? 'badge-win' : (formArr[i] === 'B' ? 'badge-draw' : 'badge-loss');
        formHtml += '<span class="form-badge ' + bClass + '">' + formArr[i] + '</span>';
      }

      var matchArr = teamMatchesMap[team.team] || [];
      var matchesHtml = '';
      for (var k = 0; k < matchArr.length; k++) {
        matchesHtml += '<li><span>' + matchArr[k] + '</span></li>';
      }

      modalContent.innerHTML = 
        '<div style="text-align:center; margin-bottom:15px;">' +
          '<h2 style="color:#38bdf8;">' + team.team + '</h2>' +
          '<div style="color:#94a3b8; font-size:0.85rem; margin-top:4px;">Trendyol Süper Lig 2026 Sezon Performansı</div>' +
        '</div>' +

        '<div style="background:#0f172a; padding:12px; border-radius:10px; text-align:center; margin-bottom:15px;">' +
          '<div style="font-size:0.8rem; color:#94a3b8; margin-bottom:6px;">Son 5 Maç Form Durumu</div>' +
          '<div>' + formHtml + '</div>' +
        '</div>' +

        '<div class="stats-grid">' +
          '<div class="stat-card"><div class="stat-val">' + team.ppm + '</div><div class="stat-lbl">Maç Başı Puan Ort.</div></div>' +
          '<div class="stat-card"><div class="stat-val">' + team.cleanSheet + '</div><div class="stat-lbl">Gol Yemediği Maç</div></div>' +
          '<div class="stat-card"><div class="stat-val">' + team.homeStat + '</div><div class="stat-lbl">İç Saha Karnesi</div></div>' +
          '<div class="stat-card"><div class="stat-val">' + team.ag + ' Attı / ' + team.yg + ' Yedi</div><div class="stat-lbl">Gol Dengesi</div></div>' +
        '</div>' +

        '<div style="margin-top:20px;">' +
          '<h4 style="color:#38bdf8; font-size:0.9rem; margin-bottom:8px;">📅 Bu Sezon Oynadığı Tüm Maçlar (' + matchArr.length + ' Maç):</h4>' +
          '<ul class="results-list">' + matchesHtml + '</ul>' +
        '</div>';

      document.getElementById('matchModal').style.display = 'flex';
    }

    function openModal(id) {
      var match = null;
      for (var i = 0; i < matches.length; i++) {
        if (matches[i].id === id) {
          match = matches[i];
          break;
        }
      }
      if (!match) return;

      var modalContent = document.getElementById('modalContent');
      if (!modalContent) return;

      modalContent.innerHTML = 
        '<div style="text-align:center; margin-bottom:10px;"><span class="league-badge" style="font-size:0.85rem;">' + match.league + '</span></div>' +
        '<div class="match-header-card">' +
          '<div class="team-box"><div class="team-name">' + match.home + '</div><div style="font-size:0.75rem; color:#94a3b8;">Ev Sahibi</div></div>' +
          '<div class="score-pred">' + match.predScore + '</div>' +
          '<div class="team-box"><div class="team-name">' + match.away + '</div><div style="font-size:0.75rem; color:#94a3b8;">Deplasman</div></div>' +
        '</div>' +
        '<div class="prob-bar-container">' +
          '<div class="prob-title">AI Olasılık Tahmini (%)</div>' +
          '<div class="prob-bar">' +
            '<div class="prob-home" style="width: ' + match.probHome + '%"></div>' +
            '<div class="prob-draw" style="width: ' + match.probDraw + '%"></div>' +
            '<div class="prob-away" style="width: ' + match.probAway + '%"></div>' +
          '</div>' +
          '<div class="prob-legend">' +
            '<span style="color:#10b981;">1 (' + match.probHome + '%)</span>' +
            '<span style="color:#f59e0b;">X (' + match.probDraw + '%)</span>' +
            '<span style="color:#3b82f6;">2 (' + match.probAway + '%)</span>' +
          '</div>' +
        '</div>' +
        '<div class="stats-grid">' +
          '<div class="stat-card"><div class="stat-val">' + match.homeXg + ' - ' + match.awayXg + '</div><div class="stat-lbl">Beklenen Gol (xG)</div></div>' +
          '<div class="stat-card"><div class="stat-val">' + match.bestPick + '</div><div class="stat-lbl">Önerilen AI Bahis Tercihi</div></div>' +
        '</div>' +
        '<div class="analysis-text"><strong style="color:#38bdf8;">🧠 Yapay Zeka Taktiksel Yorumu:</strong><br/>' + match.comment + '</div>';

      document.getElementById('matchModal').style.display = 'flex';
    }

    function closeModal() {
      var modal = document.getElementById('matchModal');
      if (modal) modal.style.display = 'none';
    }

    function filterTable() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var filtered = [];
      for (var i = 0; i < matches.length; i++) {
        var m = matches[i];
        if (m.home.toLowerCase().indexOf(q) !== -1 || 
            m.away.toLowerCase().indexOf(q) !== -1 || 
            m.league.toLowerCase().indexOf(q) !== -1) {
          filtered.push(m);
        }
      }
      renderTable(filtered);
    }

    window.onclick = function(e) {
      var modal = document.getElementById('matchModal');
      if (e.target === modal) {
        closeModal();
      }
    };

    // SAYFA YÜKLENDİĞİNDE TABLOLARI DOLDUR
    window.onload = function() {
      renderTable(matches);
      renderStandings();
    };
  </script>
