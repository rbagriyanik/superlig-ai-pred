<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Global Futbol Karşılaşmaları Haftalık Tahminleri</title>

  <!-- PWA ve Mobil Uygulama Desteği -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GlobalFutbol">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/53/53283.png">

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 15px; }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 6px; }
    .header p { color: #94a3b8; font-size: 0.95rem; }
    .controls-bar { width: 100%; max-width: 950px; display: flex; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .search-input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background-color: #1e293b; color: #f8fafc; outline: none; }
    .search-input:focus { border-color: #38bdf8; }
    .table-container { width: 100%; max-width: 950px; background-color: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); overflow: hidden; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    thead { background-color: #0f172a; border-bottom: 2px solid #334155; }
    th { padding: 14px 16px; font-size: 0.85rem; text-transform: uppercase; color: #38bdf8; }
    td { padding: 14px 16px; border-bottom: 1px solid #334155; font-size: 0.9rem; color: #e2e8f0; }
    tbody tr { cursor: pointer; transition: background-color 0.2s ease; }
    tbody tr:hover { background-color: #334155; }
    .derby-row { background-color: rgba(239, 68, 68, 0.12) !important; }
    .derby-badge { background-color: #ef4444; color: #ffffff; padding: 2px 7px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; margin-left: 6px; }
    .league-badge { background-color: #334155; color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-right: 6px; }
    .action-btn { background-color: #0284c7; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; display: inline-block; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.75); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; backdrop-filter: blur(4px); }
    .modal-card { background-color: #1e293b; border: 1px solid #38bdf8; border-radius: 16px; width: 100%; max-width: 650px; padding: 24px; box-shadow: 0 20px 30px rgba(0,0,0,0.6); position: relative; max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
    .close-btn:hover { color: #fff; }
    .match-header-card { display: flex; justify-content: space-around; align-items: center; margin-bottom: 20px; background: #0f172a; padding: 15px; border-radius: 12px; }
    .team-box { text-align: center; flex: 1; }
    .team-name { font-size: 1.1rem; font-weight: bold; color: #f8fafc; }
    .score-pred { font-size: 1.8rem; font-weight: 800; color: #38bdf8; padding: 0 10px; }
    .prob-bar-container { margin: 15px 0; }
    .prob-title { font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    .prob-bar { display: flex; height: 20px; border-radius: 10px; overflow: hidden; background-color: #334155; }
    .prob-home { background-color: #10b981; }
    .prob-draw { background-color: #f59e0b; }
    .prob-away { background-color: #3b82f6; }
    .prob-legend { display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 6px; }
    .analysis-text { background-color: #0f172a; padding: 14px; border-radius: 10px; font-size: 0.9rem; line-height: 1.5; color: #cbd5e1; margin-top: 15px; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
    .stat-card { background: #0f172a; padding: 10px; border-radius: 8px; text-align: center; }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
    .stat-lbl { font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Global Futbol Karşılaşmaları Haftalık Tahminleri</h1>
    <p>🤖 Süper Lig, La Liga, Premier League, Serie A, Bundesliga & Liga Portugal AI Analizi</p>
  </div>

  <div class="controls-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="Takım veya Lig ismi ile ara..." onkeyup="filterTable()">
  </div>

  <div class="table-container">
    <table id="matchTable">
      <thead>
        <tr>
          <th>Tarih</th>
          <th>Saat</th>
          <th>Lig</th>
          <th>Ev Sahibi</th>
          <th>Deplasman</th>
          <th>Stadyum</th>
          <th>AI Analiz</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="modal-overlay" id="matchModal">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>
